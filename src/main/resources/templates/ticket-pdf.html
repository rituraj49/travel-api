<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <style>
        body {
            font-family: Arial, sans-serif;
            font-size: 12px;
            color: #333;
        }

        h2, h3 {
            margin-bottom: 4px;
        }

        .section {
            margin-bottom: 20px;
            padding: 10px;
            border: 1px solid #aaa;
            border-radius: 4px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 6px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 6px;
            font-size: 12px;
        }

        th {
            background: #f2f2f2;
        }
    </style>
    <title>Ticket pdf</title>
</head>
<body>
<h2>Flight Ticket</h2>

<div class="section">
    <h3>Reservation Details</h3>
    <p><b>Booking ID:</b> <span th:text="${booking.bookingId}"></span></p>
    <p><b>PNR:</b> <span th:text="${booking.pnr}"></span></p>
    <p><b>Route:</b>
        <span th:text="${booking.origin}"></span> →
        <span th:text="${booking.destination}"></span>
    </p>
    <p><b>Total Fare:</b>
        <span th:text="${booking.currencyCode} + ' ' + ${booking.price}"></span>
    </p>
    <p><b>Last Ticket Date:</b> <span th:text="${booking.lastTicketDate}"></span></p>
</div>

<div class="section">
    <h3>Passenger Details</h3>
    <table>
        <thead>
        <tr>
            <th>Name</th>
            <th>Gender</th>
            <th>Type</th>
            <th>DOB</th>
            <th>Lead?</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="t : ${booking.travelers}">
            <td th:text="t.firstName + ' ' + t.lastName"></td>
            <td th:text="t.gender"></td>
            <td th:text="t.travelerType"></td>
            <td th:text="t.dateOfBirth"></td>
            <td th:text="t.leadTraveler ? 'Yes' : 'No'"></td>
        </tr>
        </tbody>
    </table>
</div>

<div class="section">
    <h3>Flight Itinerary</h3>
    <table>
        <thead>
        <tr>
            <th>Leg</th>
            <th>Carrier</th>
            <th>Flight</th>
            <th>From</th>
            <th>To</th>
            <th>Departure</th>
            <th>Arrival</th>
            <th>Duration</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="leg : ${booking.flightLegs}">
            <td th:text="${leg.legNo}"></td>
            <td th:text="${leg.carrierName} + ' (' + leg.carrierCode + ')'"></td>
            <td th:text="${leg.flightNumber}"></td>
            <td th:text="${leg.departureAirport}"></td>
            <td th:text="${leg.arrivalAirport}"></td>
            <td th:text="${leg.departureDateTime}"></td>
            <td th:text="${leg.arrivalDateTime}"></td>
            <td th:text="${leg.duration}"></td>
        </tr>
        </tbody>
    </table>
</div>

<p style="text-align: center; margin-top: 25px;">
    Thank you for choosing us.
</p>
</body>
</html>
