<p>Dear Customer,</p>

<p>Your flight booking is confirmed. Below is your booking summary:</p>

<!-- LOOP THROUGH MULTIPLE BOOKINGS (Outbound / Inbound) -->
<div th:each="b, iter : ${bookings}"
     style="border: 1px solid #ddd; padding: 12px; margin-bottom: 16px; border-radius: 6px;">

    <h3 th:text="'Trip ' + (${iter.index} + 1)"
        style="margin: 0 0 10px; color: #222;"></h3>

    <p><strong>PNR:</strong> <span th:text="${b.pnr}"></span></p>
    <p>
        <strong>Route:</strong>
        <span th:text="${b.origin}"></span> → <span th:text="${b.destination}"></span>
    </p>

    <p>
        <strong>Travel Date:</strong>
        <span th:text="${b.flightLegs.get(0).departureDateTime}"></span>
    </p>

    <p><strong>Total Price:</strong>
        <span th:text="${b.currencyCode}"></span>
        <span th:text="${b.price}"></span>
    </p>

    <!-- Travelers list -->
    <p><strong>Travelers:</strong></p>
    <ul>
        <li th:each="t : ${b.travelers}"
            th:text="|${t.firstName} ${t.lastName} (${t.travelerType})|">
        </li>
    </ul>

</div>

<p>Your full ticket(s) are attached as PDF.</p>

<p>Thank you for booking with us.</p>
</body>
